<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Cadastrar Pet')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="main-content container mt-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold mb-0"><i class="bi bi-plus-circle me-2 text-primary"></i>Novo Pet</h3>
                    <a th:href="@{/pets}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
                </div>

                <form th:action="@{/pets}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nome" class="form-label fw-semibold">Nome do Pet *</label>
                            <input type="text" id="nome" name="nome" class="form-control" placeholder="Ex: Rex, Luna" required>
                        </div>

                        <div class="col-md-6">
                            <label for="tutorId" class="form-label fw-semibold">Tutor Responsável *</label>
                            <select id="tutorId" name="tutorId" class="form-select" required>
                                <option value="">Selecione o Tutor...</option>
                                <option th:each="t : ${tutores}" th:value="${t.id}" th:text="${t.nome} + ' (' + ${t.cpf} + ')'"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="especie" class="form-label fw-semibold">Espécie *</label>
                            <select id="especie" name="especie" class="form-select" required>
                                <option value="">Selecione a espécie...</option>
                                <option th:each="esp : ${especies}" th:value="${esp}" th:text="${esp}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="raca" class="form-label fw-semibold">Raça</label>
                            <input type="text" id="raca" name="raca" class="form-control" placeholder="Ex: Labrador, Siamês, SRD">
                        </div>

                        <div class="col-md-6">
                            <label for="peso" class="form-label fw-semibold">Peso Inicial (kg)</label>
                            <input type="number" step="0.01" id="peso" name="peso" class="form-control" placeholder="Ex: 12.50">
                        </div>

                        <div class="col-md-6">
                            <label for="dataNascimento" class="form-label fw-semibold">Data de Nascimento</label>
                            <input type="date" id="dataNascimento" name="dataNascimento" class="form-control">
                        </div>

                        <div class="col-12">
                            <label for="observacoes" class="form-label fw-semibold">Observações / Alergias</label>
                            <textarea id="observacoes" name="observacoes" class="form-control" rows="3" placeholder="Informações relevantes de saúde, histórico ou temperamento..."></textarea>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
                                <i class="bi bi-check-circle me-1"></i>Salvar Pet
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
