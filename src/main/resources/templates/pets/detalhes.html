<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Prontuário de ' + ${pet.nome})}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="main-content container mt-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <!-- Cabeçalho do Prontuário -->
    <div class="card p-4 mb-4 bg-white">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <span class="badge bg-info text-dark mb-1" th:text="${pet.especie}">Espécie</span>
                <h2 class="fw-bold mb-1" th:text="${pet.nome}">Nome do Pet</h2>
                <div class="text-muted">
                    Raça: <strong th:text="${pet.raca}">Raça</strong> •
                    Peso Atual: <strong th:text="${pet.peso != null ? pet.peso + ' kg' : 'N/A'}">Peso</strong> •
                    Tutor: <a th:href="@{/tutores/{id}(id=${pet.tutor.id})}" class="text-decoration-none fw-semibold" th:text="${pet.tutor.nome}">Tutor</a>
                </div>
            </div>

            <div class="d-flex gap-2">
                <a th:href="@{/agendamentos/novo}" class="btn btn-primary">
                    <i class="bi bi-calendar-plus me-1"></i>Agendar Consulta
                </a>
                <a th:href="@{/pets}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Voltar
                </a>
            </div>
        </div>

        <div th:if="${pet.observacoes}" class="mt-3 p-3 bg-light rounded-3 border-start border-primary border-4">
            <small class="fw-bold text-uppercase text-secondary d-block">Observações e Alergias:</small>
            <span th:text="${pet.observacoes}">Observações</span>
        </div>
    </div>

    <!-- Timeline Longitudinal de Saúde -->
    <div class="card p-4">
        <h4 class="fw-bold mb-3"><i class="bi bi-clock-history me-2 text-primary"></i>Linha do Tempo de Saúde Longitudinal</h4>

        <div th:if="${#lists.isEmpty(historico)}" class="text-center py-5 text-muted">
            <i class="bi bi-folder2-open fs-1 d-block mb-2"></i>
            Nenhum evento clínico registrado no histórico deste pet.
        </div>

        <div th:unless="${#lists.isEmpty(historico)}" class="list-group list-group-flush">
            <div th:each="item : ${historico}" class="list-group-item px-0 py-3">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <span th:if="${item.tipo == 'CONSULTA'}" class="badge bg-primary mb-1">CONSULTA</span>
                        <span th:if="${item.tipo == 'VACINA'}" class="badge bg-success mb-1">VACINA</span>
                        <span th:if="${item.tipo == 'MEDICAMENTO'}" class="badge bg-warning text-dark mb-1">MEDICAMENTO</span>
                        <span th:if="${item.tipo == 'AGENDAMENTO'}" class="badge bg-secondary mb-1">AGENDAMENTO</span>

                        <h6 class="fw-bold mb-1" th:text="${item.descricao}">Descrição do evento</h6>
                    </div>
                    <small class="text-muted" th:text="${#temporals.format(item.data, 'dd/MM/yyyy HH:mm')}">Data</small>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
