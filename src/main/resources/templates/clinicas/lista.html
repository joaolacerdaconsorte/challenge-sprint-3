<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Clínicas Parceiras')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="main-content container mt-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0"><i class="bi bi-hospital me-2 text-primary"></i>Rede de Clínicas</h2>
            <p class="text-muted mb-0">Unidades credenciadas para consultas, exames e vacinação</p>
        </div>
        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/clinicas/nova}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i>Nova Clínica
            </a>
        </div>
    </div>

    <div class="card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Nome da Unidade</th>
                        <th>CNPJ</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th sec:authorize="hasRole('ADMIN')">Ação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${clinicas.content}">
                        <td class="fw-semibold" th:text="${c.nome}">Nome</td>
                        <td th:text="${c.cnpj}">CNPJ</td>
                        <td th:text="${c.telefone}">Telefone</td>
                        <td th:text="${c.endereco}">Endereço</td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <form th:action="@{/clinicas/{id}/excluir(id=${c.id})}" method="post" onsubmit="return confirm('Deseja excluir esta clínica?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
