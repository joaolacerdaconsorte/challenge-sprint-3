<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Cadastrar Clínica')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="main-content container mt-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold mb-0"><i class="bi bi-hospital me-2 text-primary"></i>Nova Clínica</h3>
                    <a th:href="@{/clinicas}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
                </div>

                <form th:action="@{/clinicas}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nome" class="form-label fw-semibold">Razão Social / Nome Fantasia *</label>
                            <input type="text" id="nome" name="nome" class="form-control" placeholder="Hospital Veterinário..." required>
                        </div>

                        <div class="col-md-6">
                            <label for="cnpj" class="form-label fw-semibold">CNPJ *</label>
                            <input type="text" id="cnpj" name="cnpj" class="form-control" placeholder="00.000.000/0000-00" required>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">E-mail</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="contato@clinica.com">
                        </div>

                        <div class="col-md-6">
                            <label for="telefone" class="form-label fw-semibold">Telefone Central</label>
                            <input type="text" id="telefone" name="telefone" class="form-control" placeholder="(11) 3000-0000">
                        </div>

                        <div class="col-12">
                            <label for="endereco" class="form-label fw-semibold">Endereço Completo</label>
                            <input type="text" id="endereco" name="endereco" class="form-control" placeholder="Av. Principal, 1000 - Bairro, Cidade - UF">
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
                                <i class="bi bi-check-circle me-1"></i>Salvar Clínica
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
