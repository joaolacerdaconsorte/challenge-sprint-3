<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Fila de Atendimento Clínico')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="main-content container mt-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <span class="badge bg-warning text-dark mb-1">ÁREA CLÍNICA / VETERINÁRIO</span>
            <h2 class="fw-bold mb-0"><i class="bi bi-clipboard2-pulse me-2 text-primary"></i>Fila de Atendimento</h2>
            <p class="text-muted mb-0">Agendamentos aguardando consulta veterinária e prescrição</p>
        </div>
    </div>

    <div class="card p-4">
        <div th:if="${#lists.isEmpty(filaAtendimento)}" class="text-center py-5 text-muted">
            <i class="bi bi-check2-circle fs-1 text-success d-block mb-2"></i>
            Nenhum paciente aguardando atendimento no momento.
        </div>

        <div th:unless="${#lists.isEmpty(filaAtendimento)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Data/Hora</th>
                        <th>Pet</th>
                        <th>Tutor</th>
                        <th>Clínica</th>
                        <th>Tipo</th>
                        <th>Ação Clínica</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${filaAtendimento}">
                        <td class="fw-semibold" th:text="${#temporals.format(a.dataHora, 'dd/MM/yyyy HH:mm')}">Data</td>
                        <td>
                            <strong th:text="${a.pet.nome}">Pet</strong><br>
                            <small class="text-muted" th:text="${a.pet.especie} + ' - ' + ${a.pet.raca}">Raça</small>
                        </td>
                        <td th:text="${a.pet.tutor.nome}">Tutor</td>
                        <td th:text="${a.clinica.nome}">Clínica</td>
                        <td><span class="badge bg-secondary" th:text="${a.tipo}">Tipo</span></td>
                        <td>
                            <a th:href="@{/atendimento/{id}/iniciar(id=${a.id})}" class="btn btn-warning btn-sm text-dark fw-semibold">
                                <i class="bi bi-stethoscope me-1"></i>Iniciar Atendimento
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
