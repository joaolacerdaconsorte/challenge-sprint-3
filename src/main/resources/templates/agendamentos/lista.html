<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Lista de Agendamentos')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="main-content container mt-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0"><i class="bi bi-calendar-check me-2 text-primary"></i>Agendamentos</h2>
            <p class="text-muted mb-0">Consultas, vacinações e procedimentos programados</p>
        </div>
        <div>
            <a th:href="@{/agendamentos/novo}" class="btn btn-primary">
                <i class="bi bi-calendar-plus me-1"></i>Novo Agendamento com Triagem
            </a>
        </div>
    </div>

    <div class="card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Data e Horário</th>
                        <th>Pet</th>
                        <th>Tutor</th>
                        <th>Clínica</th>
                        <th>Tipo</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${agendamentos.content}">
                        <td class="fw-semibold" th:text="${#temporals.format(a.dataHora, 'dd/MM/yyyy HH:mm')}">Data</td>
                        <td>
                            <a th:href="@{/pets/{id}(id=${a.pet.id})}" class="text-decoration-none fw-bold" th:text="${a.pet.nome}">Pet</a>
                        </td>
                        <td th:text="${a.pet.tutor.nome}">Tutor</td>
                        <td th:text="${a.clinica.nome}">Clínica</td>
                        <td><span class="badge bg-secondary" th:text="${a.tipo}">Tipo</span></td>
                        <td>
                            <span th:if="${a.status.name() == 'PENDENTE'}" class="badge bg-warning text-dark">PENDENTE</span>
                            <span th:if="${a.status.name() == 'CONFIRMADO'}" class="badge bg-primary">CONFIRMADO</span>
                            <span th:if="${a.status.name() == 'REALIZADO'}" class="badge bg-success">REALIZADO</span>
                            <span th:if="${a.status.name() == 'CANCELADO'}" class="badge bg-danger">CANCELADO</span>
                        </td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/agendamentos/{id}/comprovante(id=${a.id})}" class="btn btn-outline-info" title="Comprovante de Triagem">
                                    <i class="bi bi-file-earmark-text"></i>
                                </a>
                                <form th:if="${a.status.name() == 'PENDENTE' or a.status.name() == 'CONFIRMADO'}" th:action="@{/agendamentos/{id}/cancelar(id=${a.id})}" method="post" class="d-inline" onsubmit="return confirm('Deseja cancelar este agendamento?');">
                                    <button type="submit" class="btn btn-outline-danger" title="Cancelar"><i class="bi bi-x-circle"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
