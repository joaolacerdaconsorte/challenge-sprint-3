<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Cadastrar Tutor')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="main-content container mt-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold mb-0"><i class="bi bi-person-plus me-2 text-primary"></i>Novo Tutor</h3>
                    <a th:href="@{/tutores}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
                </div>

                <form th:action="@{/tutores}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nome" class="form-label fw-semibold">Nome Completo *</label>
                            <input type="text" id="nome" name="nome" class="form-control" placeholder="Ex: Mariana Silva" required>
                        </div>

                        <div class="col-md-6">
                            <label for="cpf" class="form-label fw-semibold">CPF *</label>
                            <input type="text" id="cpf" name="cpf" class="form-control" placeholder="000.000.000-00" required>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">E-mail *</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="mariana@email.com" required>
                        </div>

                        <div class="col-md-6">
                            <label for="telefone" class="form-label fw-semibold">Telefone / WhatsApp</label>
                            <input type="text" id="telefone" name="telefone" class="form-control" placeholder="(11) 99999-0000">
                        </div>

                        <div class="col-12">
                            <label for="endereco" class="form-label fw-semibold">Endereço Residencial</label>
                            <input type="text" id="endereco" name="endereco" class="form-control" placeholder="Rua, número, bairro, cidade - UF">
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
                                <i class="bi bi-check-circle me-1"></i>Salvar Tutor
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
