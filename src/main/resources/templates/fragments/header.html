<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' — PetCare 360 (CLYVO VET)'">PetCare 360</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --pet-primary: #0d6efd;
            --pet-secondary: #0dcaf0;
            --pet-dark: #1e293b;
            --pet-light: #f8fafc;
        }
        body {
            background-color: #f1f5f9;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand-badge {
            background: linear-gradient(135deg, #0d6efd, #06b6d4);
            color: white;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }
        .main-content {
            flex: 1 0 auto;
            padding-bottom: 40px;
        }
        .footer {
            flex-shrink: 0;
            background-color: #1e293b;
            color: #94a3b8;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <span class="navbar-brand-badge"><i class="bi bi-heart-pulse-fill me-1"></i>PetCare 360</span>
            <small class="text-secondary fw-normal d-none d-sm-inline">| CLYVO VET</small>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Painel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/pets}"><i class="bi bi-github me-1"></i>Pets</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tutores}"><i class="bi bi-people me-1"></i>Tutores</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clinicas}"><i class="bi bi-hospital me-1"></i>Clínicas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/agendamentos}"><i class="bi bi-calendar-check me-1"></i>Agendamentos</a>
                </li>
                <!-- Acesso restrito a Veterinario e Admin -->
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'VETERINARIO')">
                    <a class="nav-link text-warning fw-semibold" th:href="@{/atendimento/fila}">
                        <i class="bi bi-clipboard2-pulse me-1"></i>Atendimento Clínico
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/alertas}"><i class="bi bi-bell me-1"></i>Alertas</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <div class="text-light text-end d-none d-md-block">
                    <div class="fw-semibold small" sec:authentication="name">Usuário</div>
                    <div>
                        <span sec:authorize="hasRole('ADMIN')" class="badge bg-danger">ADMIN</span>
                        <span sec:authorize="hasRole('VETERINARIO')" class="badge bg-primary">VETERINÁRIO</span>
                        <span sec:authorize="hasRole('USER')" class="badge bg-info text-dark">TUTOR</span>
                    </div>
                </div>

                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm" title="Sair do sistema">
                        <i class="bi bi-box-arrow-right me-1"></i>Sair
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
